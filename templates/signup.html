<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02070f" />
    <title>Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="auth-page signup-page">
    <div class="auth-overlay"></div>
    <div class="auth-layout signup-layout">
      <section class="auth-hero">
        <div class="brand-wordmark">
          <span class="brand-mark">F</span>
          <span class="brand-name">FilmFinder</span>
        </div>
        <div>
          <p class="eyebrow">Start exploring</p>
          <h1>Create your watchlist.</h1>
          <p class="hero-text">
            Join FilmFinder to discover movies that match your taste.
          </p>
        </div>
      </section>

      <section class="auth-card-wrap">
        <div class="container auth-card">
          <h2>Create Account</h2>
          <form method="POST" action="/signup">
            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            />
            <input type="email" name="email" placeholder="Email" required />
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
            <button type="submit">Signup</button>
          </form>
          <p class="auth-link">
            Already have an account? <a href="/">Login</a>
          </p>
          <p class="auth-link"><a href="/skip">Skip and explore</a></p>
        </div>
      </section>
    </div>
  </body>
</html>
